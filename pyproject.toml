[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanjeevani"
version = "1.0.0"
description = "Voice-first, multi-agent medication companion for elderly patients and their caregivers (UN SDG 3)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # standard library only

[project.scripts]
sanjeevani = "sanjeevani.__main__:main"

[tool.setuptools.packages.find]
include = ["sanjeevani*"]

[tool.setuptools.package-data]
sanjeevani = ["static/*.html"]
